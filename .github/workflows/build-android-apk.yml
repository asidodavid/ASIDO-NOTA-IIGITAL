name: Build and Verify ASIDO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - 'README-ANDROID.md'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature and package metadata
        working-directory: android-app
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/asido-apk-badging.txt
          grep -q "package: name='id.asido.notadigital.test150'" /tmp/asido-apk-badging.txt
          grep -q "versionName='1.5.0'" /tmp/asido-apk-badging.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASIDO-Nota-Digital-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-install-launch-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK for emulator test
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Install and launch on Android 12 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          force-avd-creation: true
          script: |
            adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p id.asido.notadigital.test150 -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity"
            adb logcat -d -t 3000 > /tmp/asido-emulator-log.txt
            if grep -E "FATAL EXCEPTION|Process: id.asido.notadigital.test150" /tmp/asido-emulator-log.txt; then
              exit 1
            fi
