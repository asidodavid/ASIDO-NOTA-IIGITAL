plugins {
    id 'com.android.application'
}
android {
    namespace 'id.asido.notadigital'
    compileSdk 35
    defaultConfig {
        // Separate package so this new app cannot overwrite the older ASIDO app.
        applicationId 'id.asido.notadigital.v2'
        minSdk 29
        targetSdk 34
        versionCode 8
        versionName '2.0.0'
    }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
}
